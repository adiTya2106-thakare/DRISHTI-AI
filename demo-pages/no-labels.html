<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Drishti AI Demo – No Labels Test</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 40px; max-width: 600px; margin: 0 auto; }
    .notice { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 12px; margin-bottom: 24px; font-size: 13px; }
    .container { background: white; padding: 24px; border-radius: 8px; }
    input { display: block; width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { padding: 10px 20px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="notice">⚠️ SYNTHETIC TEST — Missing label test page for Drishti AI privacy detection. Tests heuristic detection.</div>
  <div class="container">
    <h2>Registration Form</h2>
    <!-- Intentionally no labels — tests heuristic / attribute-based detection -->
    <input type="text" name="uid_number" placeholder="••••  ••••  ••••" maxlength="14" />
    <input type="text" name="pan_id" placeholder="PAN: XXXXX9999X" />
    <input type="email" autocomplete="email" placeholder="Enter email" />
    <input type="tel" autocomplete="tel" placeholder="Mobile number" />
    <input type="password" autocomplete="new-password" placeholder="New password" />
    <input type="password" autocomplete="current-password" placeholder="Current password" />
    <!-- Div-based inputs (harder to detect) -->
    <div contenteditable="true" role="textbox" aria-label="Account number" style="border:1px solid #ccc; padding:10px; border-radius:4px; margin:12px 0; min-height:38px; font-size:14px;">123456789</div>
    <button type="submit">Register</button>
  </div>
  <div style="margin-top:16px; font-size:12px; color:#888;">
    Expected detections: aadhaar (heuristic), pan (heuristic), email (type), phone (type), password×2 (type), account_number (aria-label).
  </div>
</body>
</html>
